# i2head_facs.yaml
#
# FACS-based expression system for InMoov i2Head.
#
# action_units:
#   au_{N}: FACS Action Unit number N.
#     servos: servo -> {neutral: rest pose, activated: active pose}
#
# expressions:
#   {name}: named expression as an AU intensity vector.
#     aus: AU_number -> intensity (0.0–1.0)
#     sequence: (optional) list of steps, each with its own aus + duration
#
#

facs:
  action_units:
    au_1:
      description: "Inner brow raiser"
      servos:
        left_inner_brow: {neutral: 90, activated: 80}
        right_inner_brow: {neutral: 90, activated: 80}

    au_2:
      description: "Outer brow raiser"
      servos:
        left_brow: {neutral: 90, activated: 120}
        right_brow: {neutral: 90, activated: 120}

    au_4:
      description: "Brow lowerer"
      servos:
        left_brow: {neutral: 90, activated: 60}
        right_brow: {neutral: 90, activated: 60}
     
    au_7:
      description: "Lid tightener"
      servos:
        left_inner_brow: {neutral: 90, activated: 100}
        right_inner_brow: {neutral: 90, activated: 100}

    au_10:
      description: "Upper lip raiser"
      servos:
        upper_lip: {neutral: 90, activated: 105}
        
    au_12:
      description: "Lip corner puller (zygomaticus) – smile"
      servos:
        left_mouth_corner: {neutral: 90, activated: 120}
        right_mouth_corner: {neutral: 90, activated: 120}

    au_15:
      description: "Lip corner depressor (depressor anguli oris) – sad"
      servos:
        left_mouth_corner: {neutral: 90, activated: 60}
        right_mouth_corner: {neutral: 90, activated: 60}

    au_26:
      description: "Jaw drop"
      servos:
        mouth_jaw: {neutral: 30, activated: 90}

    #au_45:
    #  description: "Blink – eye closure (levator palpebrae)"
    #  servos:
    #    left_eyelid_upper: {neutral: 90, activated: 0}
    #    right_eyelid_upper: {neutral: 90, activated: 0}
    #
    #au_46:
    #  description: "Wink – unilateral left eye closure"
    #  servos:
    #    left_eyelid_upper: {neutral: 90, activated: 0}

  expressions:
    neutral:
      description: "Neutral resting face"
      duration: 0.5
      aus:
        1: 0
        2: 0
        12: 0
        15: 0
        26: 0

    smile:
      description: "Happy / friendly"
      duration: 0.3
      aus:
        10: 1.0
        12: 0.8

    sad:
      description: "Sad / disappointed"
      duration: 0.4
      aus:
        1: 0.5
        2: 0.8
        15: 0.6
        26: 0.2
        
    angry:
      description: "Angry / frustrated"
      duration: 0.3
      aus:
        4: 1.0
        7: 1.0
        10: 0.5
        15: 0.5

    surprised:
      description: "Surprised"
      duration: 0.25
      aus:
        1: 1.0
        2: 1.0
        26: 1.0
        
    #blink:
    #  description: "Quick eye blink"
    #  duration: 0.12
    #  sequence:
    #    - aus: {45: 1.0}
    #      duration: 0.08
    #    - aus: {45: 0.0}
    #      duration: 0.15
    #

    #wink_left:
    #  description: "Wink with left eye"
    #  duration: 0.1
    #  sequence:
    #    - aus: {46: 1.0}
    #      duration: 0.08
    #    - aus: {46: 0.0}
    #      duration: 0.2

    eyebrow_raise:
      description: "Raise both eyebrows"
      duration: 0.3
      aus:
        1: 0.7
        2: 0.7
