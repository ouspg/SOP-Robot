# i2head.yaml - Module definition for InMoov i2Head
#
# This YAML file is the single source of truth for all i2Head
# servo configuration. The same firmware and ROS2 nodes can be
# used with different modules by swapping this file.

module:
  name: "InMoov i2Head"
  description: "i2Head facial expression module with PCA9685 servo driver"
  driver: "pca9685"
  i2c_address: "0x40"
  pwm_frequency: 50
  num_channels: 16

servos:

  # --- Large servos (PDI-6221MG):
  head_pan:
    channel: 14
    model: "PDI-6221MG"
    pulse_min: 600
    pulse_max: 2400
    angle_min: 60
    angle_max: 120
    home: 90
    reversed: false

  mouth_jaw:
    channel: 15
    model: "PDI-6221MG"
    pulse_min: 600
    pulse_max: 2400
    angle_min: 30
    angle_max: 90
    home: 30
    reversed: false

  # --- Eyes: 4× PDI-1109MG (micro servos) ---
