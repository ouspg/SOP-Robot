[workspace]
name = "sop-robot"
version = "0.1.0"
description = "ROS 2 Humble workspace for the SOP Dynamixel robot"
requires-pixi = ">=0.67.0"
channels = ["https://prefix.dev/robostack-humble", "https://prefix.dev/conda-forge"]
platforms = ["linux-64"]

[activation.env]
PYTHONIOENCODING = "utf-8"
PYTHONNOUSERSITE = "1"
SOP_ROBOT_ROOT = "${SOP_ROBOT_ROOT:-$PIXI_PROJECT_ROOT}"
ROS_DISTRO = "humble"
ROS_PYTHON_VERSION = "3"
ROS_VERSION = "2"

[target.unix.activation.env]
ALSA_PLUGIN_DIR = "/usr/lib/x86_64-linux-gnu/alsa-lib"
AMENT_PREFIX_PATH = "$CONDA_PREFIX"
CMAKE_PREFIX_PATH = "$CONDA_PREFIX:$CONDA_PREFIX/x86_64-conda-linux-gnu/sysroot/usr"
COLCON_PREFIX_PATH = ""
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib:$CONDA_PREFIX/opt/rviz_ogre_vendor/lib"
PYTHONPATH = "$CONDA_PREFIX/lib/python3.12/site-packages:$CONDA_PREFIX/lib/python312/site-packages"
ROS_PACKAGE_PATH = ""

[dependencies]
python = ">=3.12,<3.13"
pip = "*"
setuptools = ">=69.5,<80"
wheel = "*"
cmake = ">=3.22,<3.27"
compilers = "*"
make = "*"
ninja = "*"
pkg-config = "*"
git = "*"
curl = "*"
unzip = "*"
colcon-common-extensions = "*"
cuda-cudart = "13.2.*"
libcublas = ">=13.3,<13.5"

ros-humble-desktop = "*"
ros-humble-ament-lint-common = "*"
ros-humble-camera-calibration-parsers = "*"
ros-humble-control-msgs = "*"
ros-humble-cv-bridge = "*"
ros-humble-dynamixel-sdk = "*"
ros-humble-hardware-interface = "*"
ros-humble-image-view = "*"
ros-humble-joint-trajectory-controller = "*"
ros-humble-pluginlib = "*"
ros-humble-ros2-control = "*"
ros-humble-ros2-controllers = "*"
ros-humble-rosidl-default-generators = "*"
ros-humble-xacro = "*"

alsa-lib = "*"
alsa-plugins = "*"
dlib = ">=19.24,<21"
numpy = ">=1.26,<2"
opencv = ">=4.10,<5"
portaudio = "*"
pyaudio = "*"
pyserial = "*"
scikit-learn = "*"
scipy = "*"
yaml-cpp = "*"
ruff = ">=0.13,<0.14"
basedpyright = ">=1.39.8,<2"

[pypi-options]
index-strategy = "unsafe-best-match"

[pypi-dependencies]
"coqui-tts" = ">=0.27.5,<0.28"
"deepface" = "==0.0.92"
"httpx" = "*"
"pillow" = "*"
"progressbar" = "==2.5"
"tensorflow" = ">=2.19,<2.20"
"tf-keras" = ">=2.19,<2.20"
"torch" = { version = "==2.11.0", index = "https://download.pytorch.org/whl/cu130" }
"torchvision" = { version = "==0.26.0", index = "https://download.pytorch.org/whl/cu130" }
"torchaudio" = { version = "==2.11.0", index = "https://download.pytorch.org/whl/cu130" }
"ultralytics" = ">=8.3,<9"
"torchcodec" = ">=0.12,<0.14"
"transformers" = ">=4.57,<5"
faster-whisper = ">=1.2.1, <2"
webrtcvad-wheels = ">=2.0.14, <3"
huggingface-hub = ">=0.36.2, <0.37"
openai = ">=2,<3"
python-dotenv = ">=1,<2"
diagrams = ">=0.25.1, <0.26"

[tasks]
sync-submodules = { cmd = "git submodule update --init --recursive src/dynamixel-workbench src/dynamixel-workbench-msgs", description = "Fetch source dependencies checked into .gitmodules" }
build = { cmd = "colcon build --symlink-install", depends-on = ["sync-submodules"], inputs = ["src"], outputs = ["install/setup.sh"], description = "Build the ROS 2 workspace" }
test = { cmd = "colcon test --python-testing pytest --event-handlers console_direct+ && colcon test-result --verbose", description = "Run ROS 2 package tests" }
lint = { cmd = "ruff check . && ruff format --check .", description = "Run Ruff lint and formatting checks" }
typecheck = { cmd = "basedpyright", description = "Run BasedPyright across the Python workspace" }
format = { cmd = "ruff check . --fix && ruff format .", description = "Apply Ruff lint and formatting fixes" }
clean = { cmd = "rm -rf build install log", description = "Remove colcon build outputs" }

robot = { cmd = "bash -lc 'source install/local_setup.sh && ros2 launch robot robot.launch.py'", description = "Launch the real robot stack" }
robot-head = { cmd = "bash -lc 'source install/local_setup.sh && ros2 launch robot robot.launch.py robot_parts:=head'", description = "Launch the real robot head only" }
robot-fake = { cmd = "bash -lc 'source install/local_setup.sh && ros2 launch robot robot.fake.launch.py'", description = "Launch the fake robot stack" }
robot-demo-real = { cmd = "bash -lc 'source install/local_setup.bash && ros2 launch full_demo real_robot.launch.py'", description = "Launch the complete demo with the real robot" }
robot-demo-fake = { cmd = "bash -lc 'source install/local_setup.bash && ros2 launch full_demo fake_robot.launch.py'", description = "Launch the complete demo with fake robot hardware" }
face-tracker = { cmd = "bash -lc 'source install/local_setup.sh && ros2 launch face_tracker face_tracker.launch.py'", description = "Launch the face tracker" }
face-tracker-movement = { cmd = "bash -lc 'source install/local_setup.sh && ros2 run face_tracker_movement face_tracker_movement_node'", description = "Launch face-tracker-driven movement" }
unified-arms = { cmd = "bash -lc 'source install/local_setup.bash && ros2 run unified_arms unified_arms_node'", description = "Launch the unified arm and hand gesture controller" }
tts = { cmd = "bash -lc 'source install/local_setup.sh && ros2 run tts_package service'", description = "Launch the text-to-speech node" }
sst = { cmd = "bash -lc 'source install/local_setup.bash && ros2 launch sst_package sst.launch.py'", description = "Launch speech-to-text using the system input device" }
setup-udev = { cmd = "bash scripts/setup_dynamixel_udev.sh", description = "Install Dynamixel U2D2 udev rules (requires sudo)" }
download-tts-model = { cmd = "bash scripts/download_tts_model.sh", description = "Download the TTS model files used by tts_package" }
llm = { cmd = "bash -lc 'source install/local_setup.bash && ros2 run llm_package llm_node'", description = "Launch the conversational language-model node" }
chatbot = { cmd = "bash -lc 'source install/local_setup.bash && ros2 launch full_demo chatbot.launch.py'", description = "Launch the integrated SST, LLM, and TTS voice chatbot" }
setup-runtime = { depends-on = ["sync-submodules", "download-tts-model"], description = "Fetch source dependencies and runtime model assets" }
